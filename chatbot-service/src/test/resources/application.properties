spring.application.name=chatbot-service
spring.datasource.url=jdbc:h2:mem:chatbot_testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

cropdeal.price-service.url=http://localhost:8084
cropdeal.crop-service.url=http://localhost:8083

sarvam.api-key=test-sarvam-key
sarvam.system-prompt=You are a helpful assistant.
sarvam.max-history-messages=10
