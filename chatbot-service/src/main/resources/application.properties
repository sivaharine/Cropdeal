spring.application.name=chatbot-service
server.port=8088

spring.config.import=optional:configserver:http://localhost:8888

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

sarvam.api.base-url=https://api.sarvam.ai
sarvam.api.subscription-key=${SARVAM_API_KEY:sk_aegqhe06_4FfBBjAeBdD3rCdoIANn8vTB}
sarvam.api.model=sarvam-105b
sarvam.api.max-history-messages=20
sarvam.api.system-prompt=You are CropDeal assistant. Answer clearly within 3 sentences. Do not exaggerate or add unnecessary details.

# Actuator & Swagger
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html