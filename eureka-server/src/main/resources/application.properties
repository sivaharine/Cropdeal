server.port=8761

spring.application.name=eureka-server

#Prevents the server from registering itself as a client
eureka.client.register-with-eureka=false


eureka.client.fetch-registry=false
#Prevents fetching the registry from another Eureka server


eureka.server.enable-self-preservation=true
#Prevents Eureka from removing many service instances when 
#heartbeats are unexpectedly missed, such as during a network issue


management.endpoints.web.exposure.include=health,info
#Exposes the configured Actuator health and info endpoints over HTTP