server.port=8088

spring.application.name=order-service

spring.datasource.url=jdbc:mysql://localhost:3306/cropdeal_order_db
spring.datasource.username=naresh
spring.datasource.password=vnaresh2004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

jwt.secret=CropDealSecretKeyForJwtAuthenticationProject2026VerySecureKey

# =========================================================
# ACTUATOR & METRICS (CircuitBreakers, Retries, Health)
# =========================================================
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,retries
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.health.rabbit.enabled=false

springdoc.swagger-ui.path=/swagger-ui.html

# =========================================================
# RESILIENCE4J CIRCUIT BREAKER CONFIGURATION
# =========================================================
resilience4j.circuitbreaker.instances.paymentService.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentService.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=10000ms
resilience4j.circuitbreaker.instances.paymentService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.paymentService.automatic-transition-from-open-to-half-open-enabled=true

resilience4j.circuitbreaker.instances.cropService.sliding-window-size=10
resilience4j.circuitbreaker.instances.cropService.minimum-number-of-calls=4
resilience4j.circuitbreaker.instances.cropService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cropService.wait-duration-in-open-state=10000ms

# =========================================================
# RESILIENCE4J RETRY MECHANISM
# =========================================================
resilience4j.retry.instances.paymentService.max-attempts=3
resilience4j.retry.instances.paymentService.wait-duration=1000ms
resilience4j.retry.instances.paymentService.enable-exponential-backoff=true
resilience4j.retry.instances.paymentService.exponential-backoff-multiplier=2

resilience4j.retry.instances.cropService.max-attempts=3
resilience4j.retry.instances.cropService.wait-duration=1000ms

# =========================================================
# RABBITMQ AMQP CONFIGURATION
# =========================================================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.auto-startup=false