spring.application.name=auth-service
server.port=8081

spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

jwt.secret=CropDealAuthServiceSecretKeyForJwtTokenGeneration2026Secure
jwt.expiration=86400000

user-service.url=http://localhost:8082

spring.security.oauth2.client.registration.facebook.client-id=dummy-facebook-client-id
spring.security.oauth2.client.registration.facebook.client-secret=dummy-facebook-client-secret
spring.security.oauth2.client.registration.facebook.scope=email,public_profile

