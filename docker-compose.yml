networks:
  cropdeal-network:
    driver: bridge

volumes:
  cropdeal-mysql-data:
    driver: local
  cropdeal-rabbitmq-data:
    driver: local

services:
  # ============================================================================
  # 1. INFRASTRUCTURE: MYSQL DATABASE (Host 3307 -> Container 3306)
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: cropdeal-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 2912
      TZ: Asia/Kolkata
    volumes:
      - cropdeal-mysql-data:/var/lib/mysql
      - ./init_databases.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p2912"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cropdeal-network

  # ============================================================================
  # 2. INFRASTRUCTURE: RABBITMQ MESSAGE BROKER
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cropdeal-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - cropdeal-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - cropdeal-network

  # ============================================================================
  # 3. SPRING CLOUD: CONFIG SERVER (Port 8888)
  # ============================================================================
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: cropdeal-config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      SPRING_PROFILES_ACTIVE: native
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8888/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - cropdeal-network

  # ============================================================================
  # 4. SPRING CLOUD: EUREKA DISCOVERY SERVER (Port 8761)
  # ============================================================================
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: cropdeal-eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - cropdeal-network

  # ============================================================================
  # 5. SPRING CLOUD: API GATEWAY (Port 8080)
  # ============================================================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: cropdeal-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - cropdeal-network

  # ============================================================================
  # 6. BUSINESS MICROSERVICES
  # ============================================================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: cropdeal-auth-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: 2912
      USER_SERVICE_URL: http://user-service:8082
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - cropdeal-network

  user-service:
