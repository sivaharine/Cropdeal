spring.application.name=price-service
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3307/cropdeal_price_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=naresh
spring.datasource.password=vnaresh2004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

management.endpoints.web.exposure.include=health,info

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Government of India Open Government Data API
# Resource: Current Daily Price of Various Commodities from Various Markets (Mandi)
government.api.base-url=https://api.data.gov.in
government.api.resource-id=9ef84268-d588-465a-a308-a864a43d0070
government.api.key=579b464db66ec23bdd0000019ccb1d11bdd742ad53d0ec97112d5fe4
government.api.format=json
government.api.page-size=1000

# Government API data is daily. The scheduler runs once every day at 02:00 IST.
government.api.sync-cron=0 0 2 * * *

# Synchronize latest government prices automatically on application startup into MySQL database
government.api.sync-on-startup=true



