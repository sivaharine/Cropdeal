spring.application.name=price-service
server.port=8083

spring.config.import=optional:configserver:http://localhost:8888

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/market_price?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Government Mandi API
government.api.base-url=${GOVT_API_BASE_URL:https://api.data.gov.in}
government.api.resource-id=9ef84268-d588-465a-a308-a864a43d0070
government.api.key=${EXTERNAL_API_KEY:579b464db66ec23bdd0000019ccb1d11bdd742ad53d0ec97112d5fe4}
government.api.format=json
government.api.page-size=1000
government.api.sync-cron=0 0 2 * * *
government.api.sync-on-startup=false

# Actuator & Swagger
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html