spring.application.name=api-gateway
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Gateway routes using Eureka service names

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**

spring.cloud.gateway.routes[2].id=crop-service
spring.cloud.gateway.routes[2].uri=lb://crop-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/crops/**

spring.cloud.gateway.routes[3].id=price-service
spring.cloud.gateway.routes[3].uri=lb://price-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/prices/**

spring.cloud.gateway.routes[4].id=order-service
spring.cloud.gateway.routes[4].uri=lb://order-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/orders/**

spring.cloud.gateway.routes[5].id=payment-service
spring.cloud.gateway.routes[5].uri=lb://payment-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/payments/**

spring.cloud.gateway.routes[6].id=chatbot-service
spring.cloud.gateway.routes[6].uri=lb://chatbot-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/chatbot/**

spring.cloud.gateway.routes[7].id=negotiation-service
spring.cloud.gateway.routes[7].uri=lb://negotiation-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/negotiations/**

spring.cloud.gateway.routes[8].id=notification-service
spring.cloud.gateway.routes[8].uri=lb://notification-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/notifications/**

spring.cloud.gateway.routes[9].id=delivery-service
spring.cloud.gateway.routes[9].uri=lb://delivery-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/delivery/**

# Actuator
management.endpoints.web.exposure.include=health,info,gateway