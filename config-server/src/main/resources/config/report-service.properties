server.port=8095

# =========================================================
# EUREKA
# =========================================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =========================================================
# JWT
# =========================================================
jwt.secret=${JWT_SECRET:CropDealSuperSecretKeyForJwtAuthenticationTokenSigningCropDeal2026SecureKey}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =========================================================
# SERVICE URLS
# =========================================================
payment-service.url=${PAYMENT_SERVICE_URL:http://localhost:8089}
user-service.url=${USER_SERVICE_URL:http://localhost:8082}
crop-service.url=${CROP_SERVICE_URL:http://localhost:8083}
order-service.url=${ORDER_SERVICE_URL:http://localhost:8088}
delivery-service.url=${DELIVERY_SERVICE_URL:http://localhost:8091}

# =========================================================
# ACTUATOR & SWAGGER
# =========================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
