server.port=8082

# =========================================================
# DATABASE
# =========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/cropdeal_user_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:2912}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================================================
# EUREKA
# =========================================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =========================================================
# JWT
# =========================================================
jwt.secret=${JWT_SECRET:CropDealAuthServiceSecretKeyForJwtTokenGeneration2026Secure}

# =========================================================
# AUTH SERVICE URL
# =========================================================
auth-service.url=${AUTH_SERVICE_URL:http://localhost:8081}

# =========================================================
# ACTUATOR & SWAGGER
# =========================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
