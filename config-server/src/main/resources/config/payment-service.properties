server.port=8089

# =========================================================
# DATABASE
# =========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/cropdeal_payment_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:2912}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# EUREKA
# =========================================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =========================================================
# JWT
# =========================================================
jwt.secret=${JWT_SECRET:CropDealAuthServiceSecretKeyForJwtTokenGeneration2026Secure}

# =========================================================
# ACTUATOR & METRICS
# =========================================================
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers,circuitbreakerevents,retries
management.endpoint.health.show-details=always

# =========================================================
# RESILIENCE4J CIRCUIT BREAKER
# =========================================================
resilience4j.circuitbreaker.instances.invoiceService.sliding-window-size=5
resilience4j.circuitbreaker.instances.invoiceService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.invoiceService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.invoiceService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.invoiceService.permitted-number-of-calls-in-half-open-state=2

resilience4j.retry.instances.invoiceService.max-attempts=2
resilience4j.retry.instances.invoiceService.wait-duration=500ms

# =========================================================
# SWAGGER
# =========================================================
springdoc.swagger-ui.path=/swagger-ui.html
