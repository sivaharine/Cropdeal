server.port=8081

# =========================================================
# DATABASE
# =========================================================
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/cropdeal_auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:2912}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================================================
# EUREKA
# =========================================================
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =========================================================
# JWT
# =========================================================
jwt.secret=${JWT_SECRET:CropDealAuthServiceSecretKeyForJwtTokenGeneration2026Secure}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =========================================================
# USER / PRICE-ALERT SERVICE URLS
# =========================================================
user-service.url=${USER_SERVICE_URL:http://localhost:8082}
price-alert-service.url=${PRICE_ALERT_SERVICE_URL:http://localhost:8094}

# =========================================================
# MAIL
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:mohantest0002@gmail.com}
spring.mail.password=${MAIL_PASSWORD:ckhekprpfdncikse}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# =========================================================
# OAUTH2 FACEBOOK
# =========================================================
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:dummy-facebook-client-id}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:dummy-facebook-client-secret}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile

# =========================================================
# ACTUATOR & SWAGGER
# =========================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
