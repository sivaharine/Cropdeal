server.port=8095
spring.application.name=report-service

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Actuator & Management
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# OpenAPI / Swagger Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Service URLs for Feign Clients
payment-service.url=http://localhost:8089
user-service.url=http://localhost:8082
crop-service.url=http://localhost:8083
order-service.url=http://localhost:8088
delivery-service.url=http://localhost:8091

# JWT Configuration
jwt.secret=CropDealSuperSecretKeyForJwtAuthenticationTokenSigningCropDeal2026SecureKey
jwt.expiration=86400000
