server.port=8094

spring.application.name=price-alert-service

spring.datasource.url=jdbc:mysql://localhost:3306/cropdeal_price_alert_db
spring.datasource.username=naresh
spring.datasource.password=vnaresh2004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

cropdeal.rabbitmq.exchange=cropdeal.notification.exchange
cropdeal.rabbitmq.routing-key=price.alert

management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html

# Query local database prices from price-service (no external government API calls)
price-service.url=http://localhost:8084
price-alert.check-db-interval-ms=3600000