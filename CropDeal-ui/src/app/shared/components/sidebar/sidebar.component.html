<aside class="cropdeal-sidebar" [class.collapsed]="isCollapsed">
  <div class="sidebar-header">
    <div class="role-pill">
      <i class="fa-solid fa-seedling text-green"></i>
      <span class="role-title" *ngIf="!isCollapsed">{{ currentRole }} WORKSPACE</span>
    </div>
    <button class="collapse-btn" (click)="toggleCollapse.emit()" [title]="isCollapsed ? 'Expand Sidebar' : 'Collapse Sidebar'">
      <i class="fa-solid" [class.fa-angles-left]="!isCollapsed" [class.fa-angles-right]="isCollapsed"></i>
    </button>
  </div>

  <div class="sidebar-scroll">
    <nav class="sidebar-nav">
      <div class="nav-section-title" *ngIf="!isCollapsed">Main Navigation</div>
      <a *ngFor="let item of navItems"
         [routerLink]="item.route"
         routerLinkActive="active"
         class="sidebar-item"
         [title]="item.label">
        <div class="item-icon">
          <i [class]="item.icon"></i>
        </div>
        <span class="item-label" *ngIf="!isCollapsed">{{ item.label }}</span>
        <span *ngIf="!isCollapsed && item.badge" class="badge {{ item.badgeClass }}">{{ item.badge }}</span>
      </a>
    </nav>

    <!-- Quick Mandi Ticker in Sidebar -->
    <div class="mandi-mini-ticker" *ngIf="!isCollapsed">
      <div class="ticker-header">
        <i class="fa-solid fa-arrow-trend-up text-green"></i>
        <span>Govt Mandi Live</span>
      </div>
      <div class="ticker-item">
        <span>Basmati Rice (Pb)</span>
        <strong>₹86/kg <small class="text-success">+2.4%</small></strong>
      </div>
      <div class="ticker-item">
        <span>Sharbati Wheat (MP)</span>
        <strong>₹38.5/kg <small class="text-success">+1.1%</small></strong>
      </div>
    </div>
  </div>

  <div class="sidebar-footer" *ngIf="!isCollapsed">
    <div class="support-box">
      <i class="fa-solid fa-headset"></i>
      <div>
        <div class="support-title">Agri Support 24x7</div>
        <div class="support-sub">1800-CROPDEAL</div>
      </div>
    </div>
  </div>
</aside>
