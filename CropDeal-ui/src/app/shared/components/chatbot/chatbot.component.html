<!-- Floating Action Button -->
<button class="chatbot-fab" (click)="toggleChat()" [title]="isOpen ? 'Close Assistant' : 'Open CropDeal AI Assistant'">
  <i class="fa-solid" [class.fa-robot]="!isOpen" [class.fa-xmark]="isOpen"></i>
</button>

<!-- Chat Window -->
<div class="chatbot-window" *ngIf="isOpen">
  <div class="chat-header">
    <div class="header-left">
      <div class="assistant-avatar">
        <i class="fa-solid fa-leaf"></i>
      </div>
      <div>
        <h4>CropDeal AI Assistant</h4>
        <div class="chat-status">Online • Agriculture Advisory</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="header-btn" (click)="clearChat()" title="Clear Chat History">
        <i class="fa-solid fa-rotate-right"></i>
      </button>
      <button class="header-btn" (click)="toggleChat()" title="Minimize">
        <i class="fa-solid fa-minus"></i>
      </button>
    </div>
  </div>

  <div class="chat-quick-suggestions">
    <button *ngFor="let q of suggestedQuestions" class="suggestion-chip" (click)="send(q)">
      {{ q }}
    </button>
  </div>

  <div class="chat-messages">
    <div *ngFor="let msg of messages" class="msg-bubble" [ngClass]="msg.sender">
      <div class="msg-text">{{ msg.text }}</div>
      <div class="msg-time">{{ msg.time }}</div>
    </div>
    <div class="typing-indicator" *ngIf="isTyping">
      <span></span><span></span><span></span>
    </div>
  </div>

  <form class="chat-input-area" (ngSubmit)="send()">
    <input type="text" [(ngModel)]="userInput" name="userInput" placeholder="Ask about crops, prices, orders..." autocomplete="off">
    <button type="submit" class="send-btn" [disabled]="!userInput.trim()">
      <i class="fa-solid fa-paper-plane"></i>
    </button>
  </form>
</div>
