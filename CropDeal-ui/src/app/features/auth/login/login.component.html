<div class="login-page">

  <!-- Background leaf decorations -->
  <div class="bg-leaf bg-leaf--left">
    <svg viewBox="0 0 200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M180 0 C80 60, 20 160, 60 400 C100 260, 160 180, 180 0Z" fill="rgba(255,255,255,0.08)"/>
      <path d="M160 20 C70 80, 10 180, 50 380 C85 250, 140 160, 160 20Z" fill="rgba(255,255,255,0.05)"/>
    </svg>
  </div>
  <div class="bg-leaf bg-leaf--right">
    <svg viewBox="0 0 200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M20 0 C120 60, 180 160, 140 400 C100 260, 40 180, 20 0Z" fill="rgba(255,255,255,0.08)"/>
      <path d="M40 20 C130 80, 190 180, 150 380 C115 250, 60 160, 40 20Z" fill="rgba(255,255,255,0.05)"/>
    </svg>
  </div>

  <!-- Login Card -->
  <div class="login-card">

    <!-- Card Header (dark green section) -->
    <div class="card-header">
      <div class="logo-icon">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 4C18 4 8 10 8 20C8 26.627 12.477 32 18 32C23.523 32 28 26.627 28 20C28 10 18 4 18 4Z" fill="#52B788"/>
          <path d="M18 32V16M18 16C18 16 13 20 13 25M18 16C18 16 23 20 23 25" stroke="#1B4332" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="card-title">CropDeal Portal</h1>
      <p class="card-subtitle">Agricultural B2B Marketplace &amp; Mandi Exchange</p>
    </div>

    <!-- Card Body -->
    <div class="card-body">

      <!-- Role Selector -->
      <div class="role-section">
        <p class="role-label">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          Select your role:
        </p>
        <div class="role-grid">
          <!-- Farmer -->
          <button type="button" class="role-btn" [class.active]="selectedRole === 'FARMER'" (click)="selectRole('FARMER')">
            <svg class="role-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M12 3L2 12h3v9h7v-6h4v6h7v-9h3L12 3z"/>
            </svg>
            <span>Farmer</span>
          </button>
          <!-- Dealer -->
          <button type="button" class="role-btn" [class.active]="selectedRole === 'DEALER'" (click)="selectRole('DEALER')">
            <svg class="role-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
            <span>Dealer</span>
          </button>
          <!-- Agent -->
          <button type="button" class="role-btn" [class.active]="selectedRole === 'DELIVERY_PARTNER'" (click)="selectRole('DELIVERY_PARTNER')">
            <svg class="role-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="1" y="3" width="15" height="13" rx="1"/>
              <path d="M16 8h4l3 5v4h-7V8z"/>
              <circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
            </svg>
            <span>Agent</span>
          </button>
          <!-- Admin -->
          <button type="button" class="role-btn" [class.active]="selectedRole === 'ADMIN'" (click)="selectRole('ADMIN')">
            <svg class="role-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            <span>Admin</span>
          </button>
        </div>
      </div>

      <!-- Google Sign In -->
      <button type="button" class="google-btn" (click)="googleLogin()">
        <svg class="google-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <!-- Divider -->
      <div class="divider">
        <span class="divider-line"></span>
        <span class="divider-text">or</span>
        <span class="divider-line"></span>
      </div>

      <!-- Login Form -->
      <form (ngSubmit)="onSubmit()" autocomplete="on">
        <!-- Email Field -->
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="M2 7l10 7 10-7"/>
            </svg>
            <input
              type="email"
              class="form-input"
              [(ngModel)]="credentials.email"
              name="email"
              placeholder="Enter your email"
              autocomplete="email"
              required>
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <div class="form-label-row">
            <label class="form-label">Password</label>
            <button type="button" class="forgot-link" (click)="isForgotModalOpen = true">Forgot Password?</button>
          </div>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              [type]="showPassword ? 'text' : 'password'"
              class="form-input pr-10"
              [(ngModel)]="credentials.password"
              name="password"
              placeholder="Enter password"
              autocomplete="current-password"
              required>
            <button type="button" class="eye-btn" (click)="togglePassword()">
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
                <line x1="3" y1="3" x2="21" y2="21"/>
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Sign In Button -->
        <button type="submit" class="signin-btn" [disabled]="isLoading">
          <svg *ngIf="!isLoading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
            <polyline points="10 17 15 12 10 7"/>
            <line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          <svg *ngIf="isLoading" class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
          {{ isLoading ? 'Signing in...' : 'Sign In' }}
        </button>
      </form>

      <!-- Register Link -->
      <p class="register-prompt">
        Don't have an account?
        <a routerLink="/auth/register" class="create-link">Create Account</a>
      </p>

    </div><!-- /card-body -->
  </div><!-- /login-card -->
</div>

<!-- Forgot Password Modal -->
<div class="modal-overlay" *ngIf="isForgotModalOpen" (click)="isForgotModalOpen = false">
  <div class="modal-box" (click)="$event.stopPropagation()">
    <div class="modal-head">
      <h3>Reset Password</h3>
      <button class="modal-close" (click)="isForgotModalOpen = false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <p class="modal-desc">Enter your registered email to receive a reset link.</p>
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/>
        </svg>
        <input type="email" class="form-input" [(ngModel)]="forgotEmail" placeholder="your@email.com">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" (click)="isForgotModalOpen = false">Cancel</button>
      <button class="btn-send" (click)="submitForgotPassword()" [disabled]="forgotLoading">
        {{ forgotLoading ? 'Sending...' : 'Send Reset Link' }}
      </button>
    </div>
  </div>
</div>
