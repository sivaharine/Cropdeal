<div class="auth-page-container">
  <div class="auth-card register-card">
    <div class="auth-card-header">
      <div class="logo-box"><i class="fa-solid fa-seedling"></i></div>
      <h2>Join CropDeal</h2>
      <p>Create your account to start trading agricultural commodities</p>
    </div>

    <!-- Role Selector -->
    <div class="role-selector-section">
      <p class="role-selector-label"><i class="fa-solid fa-user-tie"></i> I am registering as:</p>
      <div class="role-selector-grid">
        <button type="button" class="role-card" [class.active]="user.role === 'FARMER'" (click)="user.role = 'FARMER'">
          <i class="fa-solid fa-tractor"></i><span>Farmer</span>
        </button>
        <button type="button" class="role-card" [class.active]="user.role === 'DEALER'" (click)="user.role = 'DEALER'">
          <i class="fa-solid fa-cart-shopping"></i><span>Dealer</span>
        </button>
        <button type="button" class="role-card" [class.active]="user.role === 'DELIVERY_PARTNER'" (click)="user.role = 'DELIVERY_PARTNER'">
          <i class="fa-solid fa-truck-fast"></i><span>Agent</span>
        </button>
        <button type="button" class="role-card" [class.active]="user.role === 'ADMIN'" (click)="user.role = 'ADMIN'">
          <i class="fa-solid fa-shield-halved"></i><span>Admin</span>
        </button>
      </div>
    </div>

    <form (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label>Full Name *</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-user"></i>
          <input type="text" [(ngModel)]="user.name" name="name" class="form-control" required placeholder="Your full name">
        </div>
      </div>

      <div class="form-group">
        <label>Email Address *</label>
        <div class="input-icon-wrap">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" [(ngModel)]="user.email" name="email" class="form-control" required placeholder="your@email.com">
        </div>
      </div>

      <div class="form-group">
        <label>Phone Number *</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-phone"></i>
          <input type="tel" [(ngModel)]="user.phone" name="phone" class="form-control" required placeholder="+91 98765 43210">
        </div>
      </div>

      <div class="form-group">
        <label>Password *</label>
        <div class="input-icon-wrap">
          <i class="fa-solid fa-lock"></i>
          <input type="password" [(ngModel)]="user.password" name="password" class="form-control" required placeholder="Min. 8 characters">
        </div>
      </div>

      <div class="register-role-badge" *ngIf="user.role">
        <i class="fa-solid fa-circle-info"></i>
        Registering as: <strong>{{ user.role | titlecase }}</strong>
      </div>

      <button type="submit" class="btn btn-navy w-full btn-lg mt-2" [disabled]="isLoading">
        <i class="fa-solid" [class.fa-user-plus]="!isLoading" [class.fa-spinner]="isLoading" [class.fa-spin]="isLoading"></i>
        {{ isLoading ? 'Creating Account...' : 'Create ' + user.role + ' Account' }}
      </button>

      <div class="auth-footer mt-3 text-center">
        <span>Already have an account? </span>
        <a routerLink="/auth/login" class="register-link">Sign In</a>
      </div>
    </form>
  </div>
</div>
