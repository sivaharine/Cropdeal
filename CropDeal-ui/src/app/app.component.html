<div class="cropdeal-app-root">

  <!-- Navbar: hidden on auth pages -->
  <ng-container *ngIf="authService.currentUser">
    <app-navbar (toggleSidebar)="toggleSidebar()"></app-navbar>

    <div class="app-body-container">
      <app-sidebar
        [isCollapsed]="isSidebarCollapsed"
        [class.mobile-open]="isSidebarMobileOpen"
        (toggleCollapse)="toggleSidebar()">
      </app-sidebar>

      <div class="sidebar-overlay"
           [class.visible]="isSidebarMobileOpen"
           (click)="closeMobileSidebar()">
      </div>

      <main class="page-content" [class.sidebar-collapsed]="isSidebarCollapsed">
        <router-outlet></router-outlet>
      </main>
    </div>

    <!-- AI Chatbot -->
    <app-chatbot></app-chatbot>
  </ng-container>

  <!-- Auth pages: no navbar/sidebar, full-screen layout -->
  <ng-container *ngIf="!authService.currentUser">
    <main class="auth-full-page">
      <router-outlet></router-outlet>
    </main>
  </ng-container>

  <!-- Global Toast Notification Container -->
  <div class="toast-container" *ngIf="toasts.length > 0">
    <div *ngFor="let t of toasts" class="toast" [ngClass]="t.type">
      <i class="fa-solid"
         [class.fa-circle-check]="t.type === 'success'"
         [class.fa-triangle-exclamation]="t.type === 'warning'"
         [class.fa-circle-xmark]="t.type === 'error'"
         [class.fa-circle-info]="t.type === 'info'">
      </i>
      <div class="toast-text">
        <strong *ngIf="t.title">{{ t.title }}</strong>
        <p>{{ t.message }}</p>
      </div>
      <button class="toast-close" (click)="removeToast(t.id)">&times;</button>
    </div>
  </div>
</div>
