<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CropDeal – Agriculture Marketplace</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CropDeal - Professional Agriculture Marketplace connecting Farmers & Dealers">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <app-root>
    <!-- Loading indicator shown while Angular bootstraps -->
    <div id="app-loading" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f0f4f8;flex-direction:column;gap:1rem;font-family:sans-serif;">
      <div style="width:50px;height:50px;border:5px solid #e2e8f0;border-top-color:#1B4332;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
      <div style="color:#1B4332;font-weight:700;font-size:1.2rem;">CropDeal</div>
      <div style="color:#64748b;font-size:0.875rem;">Loading Agriculture Marketplace...</div>
      <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
    </div>
  </app-root>
</body>
</html>
