# =========================================================
# APPLICATION CONFIGURATION
# =========================================================

spring.application.name=invoice-service
server.port=8090


# =========================================================
# MYSQL DATABASE CONFIGURATION
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/cropdeal_invoice_db
spring.datasource.username=naresh
spring.datasource.password=vnaresh2004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# =========================================================
# JPA AND HIBERNATE CONFIGURATION
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================================================
# EUREKA AND ACTUATOR CONFIGURATION
# =========================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

management.endpoints.web.exposure.include=health,info
springdoc.swagger-ui.path=/swagger-ui.html
